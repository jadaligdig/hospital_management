{% extends 'base.html' %}
{% block title %}Edit lab test{% endblock %}
{% block content %}

<a class="back-link" href="/lab-tests">← Back to lab tests</a>
<h1>Edit lab test</h1>

<div class="form-card narrow">
  <form method="post" class="form-stack">
    <label>Test name <input value="{{ lab_test[1] }}" disabled></label>
    <label>Price <input type="number" step="0.01" name="price" value="{{ lab_test[2] }}" required></label>
    <div class="form-buttons">
      <button class="btn btn-primary">Save</button>
      <a class="btn" href="/lab-tests">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
