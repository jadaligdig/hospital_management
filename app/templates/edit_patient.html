{% extends 'base.html' %}
{% block title %}Edit patient{% endblock %}
{% block content %}

<a class="back-link" href="/patients">← Back to patients</a>
<h1>Edit patient</h1>

<div class="form-card narrow">
  <form method="post" class="form-stack">
    <label>First name <input name="first_name" value="{{ patient[1] }}" required></label>
    <label>Last name <input name="last_name" value="{{ patient[2] }}" required></label>
    <label>Birth date <input type="date" name="birth_date" value="{{ patient[3] }}" required></label>
    <label>Gender
      <select name="gender">
        <option value="Male" {{ 'selected' if patient[4] == 'Male' }}>Male</option>
        <option value="Female" {{ 'selected' if patient[4] == 'Female' }}>Female</option>
      </select>
    </label>
    <label>Phone <input name="phone" value="{{ patient[5] or '' }}"></label>
    <label>Address <input name="address" value="{{ patient[6] or '' }}"></label>
    <div class="form-buttons">
      <button class="btn btn-primary">Save</button>
      <a class="btn" href="/patients">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
