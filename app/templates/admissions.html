<h1>Admissions</h1>

{% if message %}
<p style="color:red">{{ message }}</p>
{% endif %}

<form method="post" action="/admissions/add">
  <input name="patient_id" type="number" placeholder="Patient ID">
  <select name="doctor_id">
    {% for d in doctors %}
    <option value="{{ d[0] }}">{{ d[1] }} {{ d[2] }}</option>
    {% endfor %}
  </select>
  <input name="bed_id" type="number" placeholder="Bed ID">
  <input name="admit_date" type="datetime-local">
  <input name="reason" placeholder="Reason">
  <button>Admit</button>
</form>

<table border="1">
  <tr><th>ID</th><th>Patient</th><th>Doctor</th><th>Bed</th><th>Admitted</th><th>Discharged</th><th>Status</th><th>Reason</th><th></th><th></th></tr>
  {% for a in admissions %}
  <tr>
    <td>{{ a[0] }}</td><td>{{ a[1] }}</td><td>{{ a[2] }}</td><td>{{ a[3] }}</td>
    <td>{{ a[4] }}</td>
    <td>{{ a[5] if a[5] else "" }}</td>
    <td>{{ a[6] }}</td><td>{{ a[7] }}</td>
    <td>
      {% if a[6] == "Admitted" %}
      <form method="post" action="/admissions/discharge/{{ a[0] }}">
        <input name="discharge_date" type="datetime-local" required>
        <button>Discharge</button>
      </form>
      {% endif %}
    </td>
    <td>
      <form method="post" action="/admissions/delete/{{ a[0] }}"
            onsubmit="return confirm('Delete this admission?')">
        <button>Delete</button>
      </form>
    </td>
  </tr>
  {% endfor %}
</table>

<a href="/">Back</a>
