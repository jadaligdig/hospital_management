{% extends 'base.html' %}
{% block title %}Edit medicine{% endblock %}
{% block content %}

<a class="back-link" href="/medicines">← Back to medicines</a>
<h1>Edit medicine</h1>

<div class="form-card narrow">
  <form method="post" class="form-stack">
    <label>Medicine name <input name="medicine_name" value="{{ medicine[1] }}" required></label>
    <label>Unit price <input type="number" step="0.01" name="unit_price" value="{{ medicine[2] }}" required></label>
    <label>Stock qty <input type="number" name="stock_qty" value="{{ medicine[3] }}" required></label>
    <label>Reorder level <input type="number" name="reorder_level" value="{{ medicine[4] }}" required></label>
    <label>Expiry date <input type="date" name="expiry_date" value="{{ medicine[5] }}" required></label>
    <div class="form-buttons">
      <button class="btn btn-primary">Save</button>
      <a class="btn" href="/medicines">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
