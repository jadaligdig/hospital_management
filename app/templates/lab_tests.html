<h1>Lab Tests</h1>

{% if message %}
<p style="color:red">{{ message }}</p>
{% endif %}

<form method="post" action="/lab-tests/add">
  <input name="test_name" placeholder="Test name">
  <input name="price" type="number" step="0.01" placeholder="Price">
  <button>Add</button>
</form>

<table border="1">
  <tr>
    <th>Test Name</th>
    <th>Price</th>
    <th></th>
  </tr>

  {% for t in lab_tests %}
    <tr>
      <td>{{ t[1] }}</td>
      <td>{{ t[2] }}</td>
      <td><a href="/lab-tests/edit/{{ t[0] }}">Edit</a></td>
    </tr>
  {% endfor %}
</table>
