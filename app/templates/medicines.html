<h1>Medicines</h1>

{% if message %}
<p style="color:red">{{ message }}</p>
{% endif %}

<form method="post" action="/medicines/add">
  <input name="medicine_name" placeholder="Medicine name">
  <input name="unit_price" type="number" step="0.01" placeholder="Unit price">
  <input name="stock_qty" type="number" placeholder="Stock">
  <input name="reorder_level" type="number" placeholder="Reorder level" value="20">
  <input name="expiry_date" type="date">
  <button>Add</button>
</form>

<table border="1">
  <tr><th>Name</th><th>Price</th><th>Stock</th><th>Reorder level</th><th>Expiry</th><th>Alert</th><th></th><th></th></tr>
  {% for m in medicines %}
    <tr>
      <td>{{ m[1] }}</td><td>{{ m[2] }}</td><td>{{ m[3] }}</td>
      <td>{{ m[4] }}</td><td>{{ m[5] }}</td>
      <td>{% if m[3] <= m[4] %}<b style="color:red">LOW STOCK</b>{% endif %}</td>
      <td><a href="/medicines/edit/{{ m[0] }}">Edit</a></td>
      <td>
        <form method="post" action="/medicines/delete/{{ m[0] }}"
              onsubmit="return confirm('Delete this medicine?')">
          <button>Delete</button>
        </form>
      </td>
    </tr>
  {% endfor %}
</table>
