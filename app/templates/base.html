<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Hospital Management{% endblock %}</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #f3f6f9;
      color: #1f2933;
    }

    /* Top navigation bar */
    .navbar {
      background: #0b6e99;
      padding: 14px 20px;
      text-align: center;
    }
    .navbar a {
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      font-size: 18px;
    }

    /* Centered page container */
    .container {
      max-width: 900px;
      margin: 30px auto;
      padding: 0 20px;
      text-align: center;
    }

    h1 { margin: 0 0 6px; }
    .subtitle { color: #6b7785; margin: 0 0 30px; }

    /* Section cards */
    .section {
      background: #fff;
      border: 1px solid #dde3ea;
      border-radius: 10px;
      padding: 24px;
      margin-bottom: 24px;
    }
    .section h2 {
      margin: 0 0 18px;
      font-size: 20px;
      color: #0b6e99;
    }

    /* Grid of link buttons */
    .link-grid {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
    }
    .link-grid a {
      display: block;
      padding: 12px 16px;
      background: #f3f6f9;
      border: 1px solid #dde3ea;
      border-radius: 8px;
      color: #1f2933;
      text-decoration: none;
      font-weight: 500;
      transition: all 0.15s;
    }
    .link-grid a:hover {
      background: #0b6e99;
      border-color: #0b6e99;
      color: #fff;
    }
    .note { font-size: 12px; opacity: 0.7; }
  </style>
</head>
<body>

  <div class="navbar">
    <a href="/">🏥 Hospital Management</a>
  </div>

  <div class="container">
    {% block content %}{% endblock %}
  </div>

</body>
</html>
