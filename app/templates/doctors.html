<h1>Doctors</h1>

{% if message %}
<p style="color:red">{{ message }}</p>
{% endif %}

<form method="post" action="/doctors/add">
  <select name="department_id">
    {% for d in departments %}
    <option value="{{ d[0] }}">{{ d[1] }}</option>
    {% endfor %}
  </select>
  <input name="first_name" placeholder="First name">
  <input name="last_name" placeholder="Last name">
  <input name="specialization" placeholder="Specialization">
  <input name="phone" placeholder="Phone">
  <button>Add</button>
</form>

<table border="1">
  <tr><th>First name</th><th>Last name</th><th>Specialization</th><th>Phone</th><th>Department</th><th></th><th></th></tr>
  {% for d in doctors %}
  <tr>
    <td>{{ d[1] }}</td><td>{{ d[2] }}</td><td>{{ d[3] }}</td>
    <td>{{ d[4] }}</td><td>{{ d[5] }}</td>
    <td><a href="/doctors/edit/{{ d[0] }}">Edit</a></td>
    <td>
      <form method="post" action="/doctors/delete/{{ d[0] }}"
            onsubmit="return confirm('Delete this doctor?')">
        <button>Delete</button>
      </form>
    </td>
  </tr>
  {% endfor %}
</table>

<a href="/">Back</a>
